                    c.arc(0, 0, radius, 0, Math.PI * 2);
                    c.closePath();
                    c.fill();
                    c.stroke();
                } else if (shapeDef.type === 'polygon' && shapeDef.vertices) {
                    const xs = shapeDef.vertices.map(v => v.x);
                    const ys = shapeDef.vertices.map(v => v.y);
                    const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
                    const cy = (Math.min(...ys) + Math.max(...ys)) / 2;

                    c.beginPath();
                    c.moveTo(shapeDef.vertices[0].x - cx, shapeDef.vertices[0].y - cy);
                    for (let i = 1; i < shapeDef.vertices.length; i++) {
                        c.lineTo(shapeDef.vertices[i].x - cx, shapeDef.vertices[i].y - cy);
                    }
                    c.closePath();
                    c.fill();
                    c.stroke();
                }
                c.restore();
            }

            // Drawing
            function drawBackground() {
                // Background is handled by CSS on #game-world for optimal compositor performance.
                // We no longer draw it on the canvas context every frame.
            }

            function drawGround() {
                ctx.fillStyle = '#374151';
                // Extend floor fully down to the bottom of the screen
                ctx.fillRect(0, GROUND_Y, 720, 1280 - GROUND_Y);
            }

            function drawTargetLine(level = getLevelData()) {
                const lineY = GROUND_Y - level.targetHeight;

                ctx.save();

                // Draw a beautiful soft glowing neon aura around the line when a shape is above it
                let aboveTarget = false;
                for (const body of shapeBodies) {
                    if (body.isStatic) continue;
                    if (body.bounds.min.y < lineY) {
                        aboveTarget = true;
                        break;
                    }
                }

                if (aboveTarget) {
                    const glowGrad = ctx.createLinearGradient(0, lineY - 20, 0, lineY + 20);
                    const glowColor = stabilityTimer > 0 ? 'rgba(63, 227, 169, 0.22)' : 'rgba(217, 119, 6, 0.16)';
                    glowGrad.addColorStop(0, 'rgba(255,255,255,0)');
                    glowGrad.addColorStop(0.5, glowColor);
                    glowGrad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = glowGrad;
                    ctx.fillRect(0, lineY - 20, 720, 40);
                }

                ctx.setLineDash([12, 8]);
                ctx.strokeStyle = stabilityTimer > 0 ? '#3FE3A9' : '#D97706';
                ctx.lineWidth = 5;
                ctx.globalAlpha = 0.7 + Math.sin(Date.now() / 500) * 0.3;
                ctx.beginPath();
                ctx.moveTo(20, lineY);
                ctx.lineTo(700, lineY);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.font = '600 32px Fredoka';
                ctx.fillStyle = stabilityTimer > 0 ? '#3FE3A9' : '#D97706';
                ctx.textAlign = 'left';
                ctx.fillText('TARGET', 24, lineY - 10);
                ctx.restore();
            }

            function drawHeightMeter(level = getLevelData()) {
                if (shapeBodies.length === 0 || levelWon) return;

                const targetY = GROUND_Y - level.targetHeight;

                let highestY = GROUND_Y;
                for (const body of shapeBodies) {
                    if (body.isStatic) continue;
                    if (body.bounds.min.y < highestY) {
                        highestY = body.bounds.min.y;
                    }
                }

                if (highestY >= GROUND_Y) return;

                const currentHeight = GROUND_Y - highestY;
                const percentage = Math.min(100, Math.floor((currentHeight / level.targetHeight) * 100));

                const isActiveColor = countdownActive || (highestY < targetY);
                const themeColor = isActiveColor ? '#3FE3A9' : '#ffffff';
                const lineAlpha = isActiveColor ? 0.6 : 0.35;

                ctx.save();
                ctx.setLineDash([4, 4]);
                ctx.strokeStyle = themeColor;
                ctx.globalAlpha = lineAlpha;
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(100, highestY);
                ctx.lineTo(620, highestY);
                ctx.stroke();
                ctx.setLineDash([]);

                // Draw a cute badge on the right
                ctx.globalAlpha = 1.0;
                ctx.font = '600 27px Fredoka';
                ctx.fillStyle = themeColor;
                ctx.textAlign = 'right';
                ctx.fillText(`${percentage}% STACKED`, 620, highestY - 8);
                ctx.restore();
            }

            function drawBody(body) {
                const verts = body.vertices;
                ctx.save();

                if (body.isGhost) {
                    ctx.globalAlpha = 0.5;
                }

                // Quick Back.easeOut pop-in scale when this body just spawned
                let scale = 1;
                if (body.spawnAnim) {
                    const elapsed = performance.now() - body.spawnAnim.start;
                    const t = Math.min(elapsed / body.spawnAnim.duration, 1);
                    scale = backEaseOut(t);
                    if (t >= 1) {
                        body.spawnAnim = null;
                    }
                }

                // Drop shadow — no blur. Canvas shadowBlur is the most expensive 2D op
                // and was paid per shape every frame; a hard offset shadow is ~free.
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 4;

                // Draw relative to the body's own center so the pop animation scales
                // around the shape's middle instead of the canvas origin.
                ctx.translate(body.position.x, body.position.y);

                // Dynamic squash and stretch
                const sX = (body.squishX !== undefined) ? body.squishX : 1.0;
                const sY = (body.squishY !== undefined) ? body.squishY : 1.0;
                ctx.scale(scale * sX, scale * sY);

                ctx.beginPath();
                if (body.circleRadius) {
                    ctx.arc(0, 0, body.circleRadius, 0, Math.PI * 2);
                } else if (body.originalVerts) {
                    // Concave polygon: use the original local-space vertices, rotated by
                    // the body's current angle so the visual matches the physics body.
                    const cos = Math.cos(body.angle);
                    const sin = Math.sin(body.angle);
                    const ov = body.originalVerts;
                    const rx0 = ov[0].x * cos - ov[0].y * sin;
                    const ry0 = ov[0].x * sin + ov[0].y * cos;
                    ctx.moveTo(rx0, ry0);
                    for (let i = 1; i < ov.length; i++) {
                        const rx = ov[i].x * cos - ov[i].y * sin;
                        const ry = ov[i].x * sin + ov[i].y * cos;
                        ctx.lineTo(rx, ry);
                    }
                } else {
                    ctx.moveTo(verts[0].x - body.position.x, verts[0].y - body.position.y);
                    for (let i = 1; i < verts.length; i++) {
                        ctx.lineTo(verts[i].x - body.position.x, verts[i].y - body.position.y);
                    }
                }
                ctx.closePath();

                // Fill with a screen-vertical gradient, built once per body and reused.
                // Colors and extent never change, so reallocating it every frame was
                // pure garbage; spans the shape's local height (captured at spawn).
                if (!body.fillGradient) {
                    const half = body.gradHalf || (body.circleRadius ? body.circleRadius : (body.bounds.max.y - body.bounds.min.y) / 2);
                    const g = ctx.createLinearGradient(0, -half, 0, half);
                    g.addColorStop(0, body.lightColor || '#fbbf24');
                    g.addColorStop(1, body.shapeColor || '#D97706');
                    body.fillGradient = g;
                }
                ctx.fillStyle = body.fillGradient;
                ctx.fill();

                ctx.shadowColor = 'transparent';
                ctx.strokeStyle = body.darkColor || '#78350f';
                ctx.lineWidth = 9;
                ctx.stroke();

                if (body.shapeDef && body.shapeDef.isIce) {
                    ctx.save();
                    ctx.rotate(body.angle);
                    const w = body.shapeDef.width;
                    const h = body.shapeDef.height;

                    // Draw a beautiful blue-tinted inner border
                    ctx.strokeStyle = 'rgba(186, 242, 248, 0.9)';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12);

                    // Draw diagonal glossy shine (Higher contrast)
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
                    ctx.beginPath();
                    ctx.moveTo(-w / 2 + 10, -h / 2 + 10);
                    ctx.lineTo(-w / 2 + w * 0.45, -h / 2 + 10);
                    ctx.lineTo(-w / 2 + 10, -h / 2 + h * 0.45);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                    ctx.beginPath();
                    ctx.moveTo(-w / 2 + w * 0.55, -h / 2 + 10);
                    ctx.lineTo(-w / 2 + w * 0.75, -h / 2 + 10);
                    ctx.lineTo(-w / 2 + 10, -h / 2 + h * 0.75);
                    ctx.lineTo(-w / 2 + 10, -h / 2 + h * 0.55);
                    ctx.closePath();
                    ctx.fill();

                    ctx.restore();
                }

                ctx.restore();
            }

            function drawParticles() {
                for (const p of particles) {
                    ctx.save();
                    ctx.globalAlpha = p.life;
                    if (p.isDust) {
                        ctx.fillStyle = `rgba(241, 245, 249, ${p.life * 0.45})`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (p.isTimerPart) {
                        // Bright glowing particles for the timer explosion
                        ctx.fillStyle = p.color;
                        ctx.shadowColor = p.color;
                        ctx.shadowBlur = 15;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (assetCache['spark_particle']) {
                        ctx.drawImage(assetCache['spark_particle'], p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
                    } else {
                        ctx.fillStyle = `rgba(255, 215, 0, ${p.life})`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }

            function drawConfetti() {
                const confImgs = [
                    assetCache['confetti_piece_1'],
                    assetCache['confetti_piece_2'],
                    assetCache['confetti_piece_3'],
                    assetCache['confetti_piece_4'],
                ];
                for (const p of confettiParticles) {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.scale(p.sizeScale || 1.0, p.sizeScale || 1.0);
                    ctx.globalAlpha = p.life;
                    const img = confImgs[p.type];
                    if (img) {
                        ctx.drawImage(img, -18, -18, 36, 36);
                    } else {
                        ctx.fillStyle = ['#FFD700', '#10B981', '#3B82F6', '#FF6B6B'][p.type];
                        ctx.fillRect(-12, -6, 24, 12);
                    }
                    ctx.restore();
                }
            }

            // Drag and drop logic
            let pointerPos = { x: 0, y: 0 };

            function getPointerPosFromEvent(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = 720 / rect.width;
                const scaleY = 1280 / rect.height;
                if (e.changedTouches) {
                    const touch = e.changedTouches[0];
                    return { x: (touch.clientX - rect.left) * scaleX, y: (touch.clientY - rect.top) * scaleY };
                }
                return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
            }

            function findBodyAtPoint(x, y) {
                for (const body of shapeBodies) {
                    if (Matter.Bounds.contains(body.bounds, { x, y })) {
                        if (Matter.Vertices.contains(body.vertices, { x, y })) {
                            return body;
                        }
                    }
                }
                return null;
            }

            function startDragFromUI(slotIndex, pos) {
                if (levelWon) return;
                const slot = shapeSlots[slotIndex];
                if (slot.used) return;

                slot.used = true;
                slot.element.classList.add('used');

                const shapeDef = slot.shapeDef;
                const body = createShapeBody(shapeDef, pos.x, pos.y - 50);

                // Pulled from the tray: collides only with walls and ceiling, avoiding
                // shapes to prevent bulldozing them while you position.
                body.isGhost = true;
                body.collisionFilter.mask = CAT_WALL;
                applyDragMass(body);
                Body.setVelocity(body, { x: 0, y: 0 });
                Body.setAngularVelocity(body, 0);

                World.add(world, body);
                shapeBodies.push(body);

                slot.bodyRef = body;
                body.slotIndex = slotIndex;

                // Grab from the body's center when pulled out of the tray.
                const grabOffset = { x: 0, y: 0 };
                dragState = {
                    body,
                    target: { x: pos.x, y: pos.y },
                    grabWorld: { x: pos.x, y: pos.y },
                    constraint: attachDragConstraint(body, grabOffset, pos),
                    fromUI: true,
                    slotIndex
                };
            }


            function startDragFromWorld(body, pos) {
                if (levelWon) return;
                if (body.isStatic) return;
                // Record the grabbed point in the body's local frame so the shape can
                // swing around that exact spot regardless of how it later rotates.
                // Matter takes pointB as an offset from the body center (in the body's
                // frame at creation time), so pass the plain world-space grab offset —
                // NOT an inverse-rotated one, which is wrong for already-rotated bodies.
                const grabOffset = { x: pos.x - body.position.x, y: pos.y - body.position.y };

                // Stay a normal dynamic body so other shapes can push it, but stop it
                // colliding with the floor while held (so it can be dragged down to recycle).
                // It still collides with other shapes and screen boundaries/walls.
                body.dragPrevMask = body.collisionFilter.mask;
                body.collisionFilter.mask = CAT_SHAPE | CAT_WALL;
                applyDragMass(body);
                Body.setVelocity(body, { x: 0, y: 0 });
                Body.setAngularVelocity(body, 0);
                dragState = {
                    body,
                    target: { x: pos.x, y: pos.y },
                    grabWorld: { x: pos.x, y: pos.y },
                    constraint: attachDragConstraint(body, grabOffset, pos),
                    fromUI: false,
                    slotIndex: body.slotIndex
                };
                canvas.classList.add('dragging');
            }

            // --- Drag feel tunables -------------------------------------------------
            // Dragging is a soft spring constraint from the grabbed point to the pointer.
            // The shape stays a normal dynamic body — gravity makes it hang/swing from the
            // grab point, other shapes can push it, and it pushes them by its own mass.
            const DRAG_STIFFNESS = 0.08; // 0..1 — higher = tighter/snappier follow
            const DRAG_DAMPING = 0.10; // reduces wobble/overshoot
            const DRAG_MASS_SCALE = 0.01; // held shapes weigh 10% as much when bumping others
            const DRAG_GRAVITY_MULT = 10; // ...but fall under this many times normal gravity

            // Tie the grabbed point on the body to the pointer with a zero-length spring.
            // Because the anchor is an offset point on the body, the pull also produces
            // torque, so the shape naturally swings around where it was grabbed.
            function attachDragConstraint(body, grabOffset, pos) {
                const constraint = Constraint.create({
                    bodyB: body,
                    pointB: { x: grabOffset.x, y: grabOffset.y },
                    pointA: { x: pos.x, y: pos.y },
                    stiffness: DRAG_STIFFNESS,
                    damping: DRAG_DAMPING,
                    length: 0,
                });
                World.add(world, constraint);
                return constraint;
            }

            // While held, a shape weighs less in collisions (so it shoves the stack
            // around less and is pushed back more easily). The extra fall speed is
            // handled separately by the 'beforeUpdate' gravity boost in initPhysics.
            function applyDragMass(body) {
                body.dragPrevMass = body.mass;
                Body.setMass(body, body.mass * DRAG_MASS_SCALE);
            }
            function restoreDragMass(body) {
                if (body.dragPrevMass !== undefined) {
                    Body.setMass(body, body.dragPrevMass);
                    delete body.dragPrevMass;
                }
            }

            function updateDrag(pos) {
                if (!dragState) return;

                // Clamp pointer target coordinates to stay horizontally inside screen.
                let tx = Math.max(3, Math.min(717, pos.x));
                let ty = pos.y;

                // Clamp vertical target to GROUND_Y - 10 if in play area to prevent dragging shapes into floor
                if (pos.y < UI_TOP) {
                    ty = Math.min(ty, GROUND_Y - 10);
                }

                dragState.target.x = tx;
                dragState.target.y = ty;
                dragState.pointerY = pos.y; // raw pointer for recycle detection

                // Move the spring anchor; physics does the rest in Engine.update.
                if (dragState.constraint) {
                    dragState.constraint.pointA.x = tx;
                    dragState.constraint.pointA.y = ty;
                }

                // Highlight bar if dragging back into the tray
                if (pos.y > UI_TOP) {
                    shapeBar.style.background = 'rgba(60, 60, 130, 0.98)';
                    shapeBar.style.boxShadow = '0 -12px 40px rgba(120, 100, 255, 0.55), 0 -4px 16px rgba(180, 140, 255, 0.35)';
                } else {
                    shapeBar.style.background = 'rgba(30, 30, 50, 0.9)';
                    shapeBar.style.boxShadow = 'none';
                }
            }

            // The engine integrates the drag constraint during Engine.update; here we
            // just read the anchor straight off the constraint (Matter keeps pointB in
            // sync with the body's rotation) so the indicator can never drift from it.
            function updateDragPhysics() {
                if (!dragState || !dragState.constraint) return;
                const { body, constraint } = dragState;
                dragState.grabWorld = {
                    x: body.position.x + constraint.pointB.x,
                    y: body.position.y + constraint.pointB.y
                };
            }

            function endDrag(pos) {
                if (!dragState) return;
                const { body, slotIndex, constraint } = dragState;

                // Remove the drag spring first so the body is free.
                if (constraint) World.remove(world, constraint);

                // Restore full weight now that it's no longer being dragged.
                restoreDragMass(body);

                // Check if dropped back in UI area - recycle
                if (pos.y > UI_TOP) {
                    recycleShape(body, slotIndex);
                } else {
                    // Restore full collisions (walls/floor included). The body keeps its
                    // current physics velocity, so it throws and settles naturally.
                    body.isGhost = false;
                    body.collisionFilter.mask = (body.dragPrevMask !== undefined) ? body.dragPrevMask : 0xFFFFFFFF;
                    delete body.dragPrevMask;

                    // One-frame safety net: if the shape escaped past a wall or through
                    // the floor during the drag, snap it back and zero the outward velocity.
                    requestAnimationFrame(() => {
                        if (!shapeBodies.includes(body) || body.isStatic) return;
                        const margin = 5;
                        const minX = margin, maxX = 720 - margin;
                        const bw = (body.bounds.max.x - body.bounds.min.x) / 2;
                        const bh = (body.bounds.max.y - body.bounds.min.y) / 2;
                        const bx = body.position.x;
                        const by = body.position.y;
                        if (bx - bw < minX) {
                            Body.setPosition(body, { x: minX + bw, y: by });
                            if (body.velocity.x < 0) Body.setVelocity(body, { x: 0, y: body.velocity.y });
                        } else if (bx + bw > maxX) {
                            Body.setPosition(body, { x: maxX - bw, y: by });
                            if (body.velocity.x > 0) Body.setVelocity(body, { x: 0, y: body.velocity.y });
                        }
                        if (by + bh > GROUND_Y) {
                            Body.setPosition(body, { x: body.position.x, y: GROUND_Y - bh });
                            Body.setVelocity(body, { x: body.velocity.x, y: 0 });
                        }
                    });
                }

                shapeBar.style.background = 'rgba(30, 30, 50, 0.9)';
                shapeBar.style.boxShadow = 'none';
                canvas.classList.remove('dragging');
                dragState = null;
                stabilityTimer = 0;
            }

            function recycleShape(body, slotIndex) {
                World.remove(world, body);
                shapeBodies = shapeBodies.filter(b => b !== body);

                if (slotIndex !== undefined && shapeSlots[slotIndex]) {
                    const slot = shapeSlots[slotIndex];
                    slot.used = false;
                    slot.element.classList.remove('used');
                    slot.bodyRef = null;

                    // Create recycle animation on top of the slot as an HTML overlay
                    const rect = slot.element.getBoundingClientRect();
                    const containerRect = document.getElementById('game-world').getBoundingClientRect();
                    const x = rect.left - containerRect.left + rect.width / 2;
                    const y = rect.top - containerRect.top + rect.height / 2;

                    const pulseEl = document.createElement('div');
                    pulseEl.className = 'recycle-pulse-ui';
                    pulseEl.style.left = `${x}px`;
                    pulseEl.style.top = `${y}px`;
                    pulseEl.style.width = `${rect.width}px`;
                    pulseEl.style.height = `${rect.height}px`;
                    document.querySelector('.ui-overlay').appendChild(pulseEl);

                    // Remove overlay element after animation completes
                    setTimeout(() => pulseEl.remove(), 1000);
                }
                playSound('recycle_sound', 0.5);
            }

            // Event listeners for play mode
            function setupPlayControls() {
                // Scroll arrow functionality
                addCleanEventListener(scrollLeftBtn, 'click', () => {
                    shapeBar.scrollBy({ left: -228, behavior: 'smooth' });
                });
                addCleanEventListener(scrollRightBtn, 'click', () => {
                    shapeBar.scrollBy({ left: 228, behavior: 'smooth' });
                });

                // Listen to scroll events on shapeBar to dynamically update disabled state of arrows
                addCleanEventListener(shapeBar, 'scroll', updateScrollButtons);

                // Handle shape bar touches separately
                let barScrolling = false;
                let barStartX = 0;
                let barStartY = 0;
                let barScrollLeft = 0;
                let dragStartedFromBar = false;
                let dragStartSlot = null;
                let dragDecided = false;

                // Momentum scrolling variables
                let scrollVelocity = 0;
                let lastClientX = 0;
                let lastMoveTime = 0;
                let momentumFrameId = null;

                function stopMomentumScroll() {
                    if (momentumFrameId) {
                        cancelAnimationFrame(momentumFrameId);
                        momentumFrameId = null;
                    }
                }

                // Expose to global so we can clean up in gameCleanup()
                window.stopMomentumScrollGlobal = stopMomentumScroll;

                function centerSlot(slotEl) {
                    if (!slotEl) return;
                    const containerWidth = shapeBar.clientWidth;
                    const slotWidth = slotEl.clientWidth;
                    const targetScrollLeft = slotEl.offsetLeft - (containerWidth / 2) + (slotWidth / 2);
                    shapeBar.scrollTo({ left: targetScrollLeft, behavior: 'smooth' });
                }

                addCleanEventListener(shapeBar, 'pointerdown', (e) => {
                    if (dragState) return; // ignore a second touch point while already dragging
                    e.preventDefault();
                    stopMomentumScroll();
                    // Capture pointer so touch drag isn't cancelled when leaving the bar element
                    shapeBar.setPointerCapture(e.pointerId);
                    barStartX = e.clientX;
                    barStartY = e.clientY;
                    barScrollLeft = shapeBar.scrollLeft;
                    barScrolling = true;
                    dragStartedFromBar = true;
                    dragDecided = false;

                    // Initialize momentum tracking
                    lastClientX = e.clientX;
                    lastMoveTime = performance.now();
                    scrollVelocity = 0;

                    // Check if on a slot
                    const slotEl = e.target.closest('.shape-slot');
                    if (slotEl && !slotEl.classList.contains('used')) {
                        dragStartSlot = parseInt(slotEl.dataset.index);
                        centerSlot(slotEl);
                    } else {
                        dragStartSlot = null;
                    }
                });

                addCleanEventListener(document, 'pointermove', (e) => {
                    if (dragState) {
                        tapCount = 0; // Reset tap count if a drag is active
                        dragTooltip.classList.remove('visible');
                        e.preventDefault();
                        const pos = getPointerPosFromEvent(e);
                        pointerPos = pos;
                        updateDrag(pos);
                        return;
                    }

                    if (barScrolling && dragStartedFromBar) {
                        const dx = e.clientX - barStartX;
                        const dy = e.clientY - barStartY;
                        const movedEnough = Math.abs(dx) > 8 || Math.abs(dy) > 8;

                        // Re-check on EVERY move (not just once) whether the gesture has
                        // become a pull-out of the tray — vertical-dominant or clearly
                        // upward motion. This lets a drag start even if the gesture began
                        // looking like a horizontal scroll, instead of latching to scroll.
                        if (dragStartSlot !== null && movedEnough && (Math.abs(dy) >= Math.abs(dx) || dy < -5)) {
                            const pos = getPointerPosFromEvent(e);
                            // Release pointer capture before starting field drag
                            try { shapeBar.releasePointerCapture(e.pointerId); } catch (ex) { }
                            startDragFromUI(dragStartSlot, pos);
                            tapCount = 0;
                            dragTooltip.classList.remove('visible');
                            canvas.classList.add('dragging');
                            dragStartedFromBar = false;
                            barScrolling = false;
                            return;
                        }

                        // Otherwise it's a horizontal scroll once past the threshold.
                        if (movedEnough) {
                            dragDecided = true;
                            shapeBar.scrollLeft = barScrollLeft - dx;

                            // Calculate velocity
                            const now = performance.now();
                            const dt = (now - lastMoveTime) / 1000;
                            if (dt > 0) {
                                scrollVelocity = (e.clientX - lastClientX) / dt;
                            }
                            lastClientX = e.clientX;
                            lastMoveTime = now;
                        }
                    }
                });

                addCleanEventListener(document, 'pointerup', (e) => {
                    // Release pointer capture if still held
                    try { shapeBar.releasePointerCapture(e.pointerId); } catch (ex) { }

                    // If it was a potential tap on a shape button from the bar
                    if (dragStartedFromBar && !dragDecided && dragStartSlot !== null && !dragState) {
                        tapCount++;
                        if (tapCount >= 2) {
                            showDragTooltip();
                        }
                    }

                    if (dragState) {
                        const pos = getPointerPosFromEvent(e);
                        endDrag(pos);
                        canvas.classList.remove('dragging');
                    }

                    // Apply momentum scroll if they were horizontal scrolling
                    if (barScrolling && dragDecided && Math.abs(scrollVelocity) > 100) {
                        stopMomentumScroll();
                        const decay = 0.94;
                        let lastStepTime = performance.now();
                        const updateMomentum = () => {
                            const now = performance.now();
                            const dt = Math.min((now - lastStepTime) / 1000, 0.1);
                            lastStepTime = now;

                            if (Math.abs(scrollVelocity) < 15) {
                                momentumFrameId = null;
                                updateScrollButtons();
                                return;
                            }
                            shapeBar.scrollLeft -= scrollVelocity * dt;
                            scrollVelocity *= Math.pow(decay, dt * 60);
                            updateScrollButtons();
                            momentumFrameId = requestAnimationFrame(updateMomentum);
                        };
                        momentumFrameId = requestAnimationFrame(updateMomentum);
                    }

                    barScrolling = false;
                    dragStartedFromBar = false;
                    dragStartSlot = null;
                    dragDecided = false;
                });

                addCleanEventListener(document, 'pointercancel', (e) => {
                    // Treat cancelled pointer same as pointerup to prevent stuck drags
                    if (dragState) {
                        const pos = getPointerPosFromEvent(e);
                        endDrag(pos);
                        canvas.classList.remove('dragging');
                    }
                    stopMomentumScroll();
                    barScrolling = false;
                    dragStartedFromBar = false;
                    dragStartSlot = null;
                    dragDecided = false;

                // Canvas interactions for world shapes
                addCleanEventListener(canvas, 'pointerdown', (e) => {
                    if (dragState) return;
                    const pos = getPointerPosFromEvent(e);
                    if (pos.y >= UI_TOP) return; // In UI area

                    if (body) {
                        e.preventDefault();

            function triggerCountdownStart() {
                timerDisplay.classList.remove('interrupted');

            function triggerInterrupted() {
                countdownActive = false;

            // Stability check
            function checkStability(dt, level = getLevelData()) {
                if (levelWon || shapeBodies.length === 0) return;

                const targetY = GROUND_Y - level.targetHeight;

                // Check if any shape is above target
                let aboveTarget = false;
                for (const body of shapeBodies) {
                    if (body.isStatic) continue;
                    if (body.bounds.min.y < targetY) {
                        aboveTarget = true;
                        break;
                    }
                }

                if (!aboveTarget) {
                    if (countdownActive) {
                        triggerInterrupted();
                    }
                    stabilityTimer = 0;
                    return;
                }

                // Check all shapes are stable
                let allStable = true;
                for (const body of shapeBodies) {
                    if (body.isStatic) continue;
                    const speed = Vector.magnitude(body.velocity);
                    if (speed > 0.88) {
                        allStable = false;
                        break;
                    }
                    if (Math.abs(body.angularVelocity) > 0.045) {
                        allStable = false;
                        break;
                    }
                }

                const totalTime = config.settings.stabilityTime || 3.4;

                if (allStable && !dragState) {
                    stabilityTimer += dt;
                    const remaining = Math.max(0, (totalTime - stabilityTimer));

                    // Countdown visuals and dimming only show up when countdown is <= 3s (i.e. stabilityTimer has run for totalTime - 3.0s)
                    const showVisuals = (stabilityTimer >= (totalTime - 3.0));

                    if (showVisuals) {
                        if (!countdownActive) {
                            countdownActive = true;
                            triggerCountdownStart();
                        }
                        timerDisplay.textContent = remaining.toFixed(1) + 's';
                        timerDisplay.classList.add('visible');
                    } else {
                        timerDisplay.classList.remove('visible');
                    }

                    if (stabilityTimer >= totalTime) {
                        timerDisplay.textContent = '0.0s';
                        timerDisplay.classList.add('golden');
                        winLevel();
                        countdownActive = false;
                    }
                } else {
                    if (countdownActive) {
                        triggerInterrupted();
                    }
                    stabilityTimer = 0;
                }
            }

            // Update particles
            function updateParticles(dt) {
                const fpsScale = dt * 60;
                let writeIdx = 0;
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    if (p.isDust) {
                        p.x += p.vx * fpsScale;
                        p.y += p.vy * fpsScale;
                        p.vy *= Math.pow(0.98, fpsScale);
                        p.vx *= Math.pow(0.98, fpsScale);
                        p.size += p.growth * fpsScale;
                    } else {
                        p.x += p.vx * fpsScale;
                        p.y += p.vy * fpsScale;
                        p.vy += 0.15 * fpsScale;
                    }
                    p.life -= p.decay * fpsScale;

                    if (p.life > 0) {
                        particles[writeIdx] = p;
                        writeIdx++;
                    } else {
                        particlePool.push(p);
                    }
                }
                particles.length = writeIdx;

                // Update recycle pulses
                for (let i = recyclePulses.length - 1; i >= 0; i--) {
                    const p = recyclePulses[i];
                    p.age += dt;
                    if (p.age >= p.duration) {
                        recyclePulses.splice(i, 1);
                    }
                }

                writeIdx = 0;
                for (let i = 0; i < confettiParticles.length; i++) {
                    const p = confettiParticles[i];
                    p.x += p.vx * fpsScale;
                    p.y += p.vy * fpsScale;
                    p.rot += p.rotSpeed * fpsScale;
                    p.vx *= Math.pow(0.99, fpsScale);

                    // Update age and fade out after a 3-7s delay
                    p.age += dt;
                    if (p.age < p.delay) {
                        p.life = 1.0;
                    } else if (p.age < p.delay + 2.0) {
                        // Fade out over 2 seconds
                        p.life = 1.0 - (p.age - p.delay) / 2.0;
                    } else {
                        p.life = 0;
                    }

                    // Recycle if offscreen or completely faded out
                    if (p.y <= 1300 && p.life > 0) {
                        confettiParticles[writeIdx] = p;
                        writeIdx++;
                    } else {
                        confettiPool.push(p);
                    }
                }
                confettiParticles.length = writeIdx;
            }

            function updateAmbientParticles(dt) {
                if (reducedMotion) { ambientParticles = []; return; }
                while (ambientParticles.length < 16) {
                    ambientParticles.push({
                        x: Math.random() * 720,
                        y: Math.random() * 1100,
                        size: 3 + Math.random() * 5,
                        speedY: -10 - Math.random() * 20,
                        swaySpeed: 0.8 + Math.random() * 1.5,
                        swayWidth: 15 + Math.random() * 25,
                        seed: Math.random() * 100,
                        alpha: 0,
                        targetAlpha: 0.15 + Math.random() * 0.35,
                        phase: 'fadeIn'
                    });
                }

                for (let i = ambientParticles.length - 1; i >= 0; i--) {
                    const p = ambientParticles[i];
                    p.y += p.speedY * dt;
                    const sway = Math.sin(Date.now() / 1000 * p.swaySpeed + p.seed) * p.swayWidth * dt;
                    p.x += sway;

                    if (p.phase === 'fadeIn') {
                        p.alpha += dt * 0.5;
                        if (p.alpha >= p.targetAlpha) {
                            p.alpha = p.targetAlpha;
                            p.phase = 'alive';
                        }
                    } else if (p.phase === 'alive') {
                        if (p.y < 150 || Math.random() < 0.005) {
                            p.phase = 'fadeOut';
                        }
                    } else if (p.phase === 'fadeOut') {
                        p.alpha -= dt * 0.5;
                    }

                    if (p.y < -20 || p.x < -50 || p.x > 770 || p.alpha <= 0) {
                        ambientParticles.splice(i, 1);
                    }
                }
            }

            function drawAmbientParticles() {
                ctx.save();
                for (const p of ambientParticles) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            // Edit mode
            function setupEditMode() {
                buildShapeUI();
                updateLevelDisplay();

                const level = getLevelData();

                let previewBodies = [];
                level.shapes.forEach((shapeDef, i) => {
                    const x = 200 + i * 200;
                    const y = GROUND_Y - shapeDef.height / 2;
                    const body = createShapeBody(shapeDef, x, y);
                    previewBodies.push(body);
                });

                function editLoop() {
                    ctx.clearRect(0, 0, 720, 1280);
                    drawBackground();
                    drawGround();
                    drawTargetLine();

                    for (let i = 0; i < previewBodies.length; i++) {
                        drawBody(previewBodies[i]);
                    }

                    // Edit mode label
                    ctx.save();
                    ctx.font = '600 24px Fredoka';
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';

                    safeRequestAnimationFrame(editLoop);

            }

            // Main game loop
            function setupPlayMode() {
                initPhysics();
                buildShapeUI();
                setupPlayControls();
                updateLevelDisplay();
                spawnStartingShapes();

                let lastTime = performance.now();
                let accumulator = 0;
                const fixedTimeStep = 1000 / 60; // 16.66 ms fixed time step for physics engine stability

                const cubicEaseOut = (t) => 1 - Math.pow(1 - t, 3);

                function gameLoop(timestamp) {
                    let dt = (timestamp - lastTime) / 1000;
                    dt = Math.min(dt, 0.11);
                    lastTime = timestamp;

                    // Level data is constant for the frame — fetch once and thread it
                    // through the per-frame consumers instead of re-fetching in each.
                    const level = getLevelData();

                    // Update physics using stable fixed timestep accumulator.
                    // (Gravity is set once in initPhysics and doesn't change during play.)
                    accumulator += dt * 1000;
                    while (accumulator >= fixedTimeStep) {
                        Engine.update(engine, fixedTimeStep);
                        accumulator -= fixedTimeStep;
                    }

                    // Track the grabbed point for the drag indicator (physics already
                    // moved the body via the constraint during Engine.update above).
                    updateDragPhysics();

                    // Update stability
                    checkStability(dt, level);

                    // Update particles
                    updateParticles(dt);

                    // Update ambient particles
                    updateAmbientParticles(dt);

                    // Update shape body squish spring physics
                    // Update shape body squish spring physics
                    const squishK = 220;
                    const squishD = 14;
                    for (const body of shapeBodies) {
                        if (body.squishX !== undefined) {
                            const ax = -squishK * (body.squishX - 1.0) - squishD * body.squishVx;
                            const ay = -squishK * (body.squishY - 1.0) - squishD * body.squishVy;
                            body.squishVx += ax * dt;
                            body.squishVy += ay * dt;
                            body.squishX += body.squishVx * dt;
                            body.squishY += body.squishVy * dt;
                        }
                    }

                    // Update target line particles and background ripples
                    updateTargetLineParticles(dt, level);
                    updateBackgroundRipples(dt);

                    // Smoothly interpolate background dim depending on whether countdown is active
                    const targetDimAlpha = countdownActive ? 0.45 : 0.0;
                    backgroundDimAlpha += (targetDimAlpha - backgroundDimAlpha) * dt * 8;

                    // Update outline fade and hand guide for Level 1
                    if (currentLevel === 0) {
                        if (shapeBodies.length === 0) {
                            outlineFade = Math.min(1, outlineFade + dt * 2.5);
                            structureFade = 0;
                            emptyTime += dt;
                            if (emptyTime >= 2.5) {
                                handTimer += dt;
                                if (handTimer > 4.2) {
                                    handTimer = 0; // Loop the sequence
                                }
                            } else {
                                handTimer = 0;
                            }
                        } else {
                            outlineFade = Math.max(0, outlineFade - dt * 2.5);

                            // Structural ghost logic: appears after 1st piece is placed, disappears when 2nd is moved
                            if (shapeBodies.length === 1 && !dragState) {
                                structureFade = Math.min(1.0, structureFade + dt * 2.0);
                            } else if (shapeBodies.length > 1 || (shapeBodies.length === 1 && dragState && dragState.fromUI)) {
                                structureFade = Math.max(0, structureFade - dt * 2.5);
                            }

                            if (shapeBodies.length === 1) {
                                emptyTime += dt;
                                if (emptyTime >= 2.5) {
                                    handTimer += dt;
                                    if (handTimer > 4.2) {
                                        handTimer = 0;
                                    }
                                } else {
                                    handTimer = 0;
                                }
                            } else {
                                emptyTime = 0;
                                handTimer = 0;
                            }
                        }
                    } else {
                        emptyTime = 0;
                        handTimer = 0;
                    }

                    // Decay screenshake
                    if (shakeAmount > 0) {
                        shakeAmount -= dt * 30; // Decays smoothly in fractions of a second
                        if (shakeAmount < 0) shakeAmount = 0;
                    }

                    // Render
                    ctx.clearRect(0, 0, 720, 1280);

                    ctx.save();
                    if (shakeAmount > 0) {
                        const dx = (Math.random() - 0.5) * shakeAmount;
                        const dy = (Math.random() - 0.5) * shakeAmount;
                        ctx.translate(dx, dy);
                    }

                    drawBackground();
                    drawBackgroundRipples();
                    drawAmbientParticles();
                    drawGround();

                    // Smooth dimming layer over background and ground (below shape bodies)
                    if (backgroundDimAlpha > 0) {
                        ctx.save();
                        ctx.fillStyle = `rgba(15, 23, 42, ${backgroundDimAlpha})`;
                        ctx.fillRect(0, 0, 720, 1280);
                        ctx.restore();
                    }

                    // Draw Level 1 tutorial outline
                    if (currentLevel === 0 && outlineFade > 0.01) {
                        const firstShape = level.shapes[0];
                        if (firstShape) {
                            const pulse = 0.6 + 0.3 * Math.sin(Date.now() / 300);
                            const finalAlpha = pulse * outlineFade;

                            ctx.save();
                            ctx.globalAlpha = finalAlpha;
                            ctx.strokeStyle = '#000000';
                            ctx.lineWidth = 10; // x2.5 thicker (from 4 to 10)
                            ctx.setLineDash([8, 6]);

                            const outlineX = 360;
                            const targetY = GROUND_Y - level.targetHeight;
                            const outlineY = targetY + 270 - (firstShape.height / 2); // Moved 330px down from -60 offset (originally 380px down, now 50px up)

                            ctx.translate(outlineX, outlineY);
                            ctx.beginPath();
                            if (firstShape.type === 'rectangle') {
                                const w = firstShape.width;
                                const h = firstShape.height;
                                const slope = firstShape.isIce ? 0 : 0.15;
                                const topW = w * (1 - 2 * slope);
                                ctx.moveTo(-topW / 2, -h / 2);
                                ctx.lineTo(topW / 2, -h / 2);
                                ctx.lineTo(w / 2, h / 2);
                                ctx.lineTo(-w / 2, h / 2);
                            } else if (firstShape.type === 'triangle') {
                                const w = firstShape.width;
                                const h = firstShape.height;
                                ctx.moveTo(0, -h / 2);
                                ctx.lineTo(-w / 2, h / 2);
                                ctx.lineTo(w / 2, h / 2);
                            } else if (firstShape.type === 'circle') {
                                ctx.arc(0, 0, firstShape.radius, 0, Math.PI * 2);
                            } else {
                                const w = firstShape.width || 100;
                                const h = firstShape.height || 100;
                                ctx.rect(-w / 2, -h / 2, w, h);
                            }
                            ctx.closePath();
                            ctx.stroke();
                            ctx.restore();
                        }
                    }

                    // Draw structural goal ghost for Level 1
                    if (currentLevel === 0 && structureFade > 0.01) {
                        ctx.save();
                        ctx.globalAlpha = structureFade * 0.45;
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 6;
                        ctx.setLineDash([8, 6]);

                        const drawGhost = (shapeDef, x, y) => {
                            ctx.save();
                            ctx.translate(x, y);
                            ctx.beginPath();
                            if (shapeDef.type === 'rectangle') {
                                const w = shapeDef.width;
                                const h = shapeDef.height;
                                const slope = 0.15;
                                const topW = w * (1 - 2 * slope);
                                ctx.moveTo(-topW / 2, -h / 2);
                                ctx.lineTo(topW / 2, -h / 2);
                                ctx.lineTo(w / 2, h / 2);
                                ctx.lineTo(-w / 2, h / 2);
                            } else if (shapeDef.type === 'triangle') {
                                const w = shapeDef.width;
                                const h = shapeDef.height;
                                ctx.moveTo(0, -h / 2);
                                ctx.lineTo(-w / 2, h / 2);
                                ctx.lineTo(w / 2, h / 2);
                            }
                            ctx.closePath();
                            ctx.stroke();
                            ctx.restore();
                        };

                        const shapes = level.shapes;
                        // Shape 0 (1st trapezoid) starting from ground
                        drawGhost(shapes[0], 360, GROUND_Y - 60);
                        // Shape 1 (2nd trapezoid) stacked on 1st
                        drawGhost(shapes[1], 360, GROUND_Y - 120 - 60);
                        // Shape 2 (triangle) on top
                        drawGhost(shapes[2], 360, GROUND_Y - 240 - 117);

                        ctx.restore();
                    }

                    // Draw hand guide for Level 1
                    let handActive = false;
                    if (currentLevel === 0 && emptyTime >= 2.5 && handTimer > 0) {
                        const firstShape = level.shapes[0];
                        if (firstShape) {
                            const targetY = GROUND_Y - level.targetHeight;
                            const outlineX = 360;
                            const outlineY = targetY + 270 - (firstShape.height / 2);

                            const handEndY = outlineY + 15;
                            const startX = outlineX - 85;
                            const startY = outlineY + 15;

                            let handX = startX;
                            let handY = startY;
                            let handEmoji = "🖐️";
                            let alpha = 0;

                            const cubicEaseInOut = (t) => {
                                return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                            };

                            if (handTimer <= 1.2) {
                                // Stage 1: Move from startY to second shape button
                                const ratio = handTimer / 1.2;
                                const eased = cubicEaseInOut(ratio);
                                handX = startX + (259 - startX) * eased;
                                handY = startY + (1204 - startY) * eased;
                                handEmoji = "🖐️";
                                alpha = handTimer < 0.2 ? Math.pow(handTimer / 0.2, 0.5) : 1;
                            } else if (handTimer <= 1.6) {
                                // Stage 2: Grab at button
                                handX = 259;
                                handY = 1204;
                                handEmoji = "👆";
                                alpha = 1;
                            } else if (handTimer <= 2.8) {
                                // Stage 3: Move from button to trapezoid outline
                                const ratio = (handTimer - 1.6) / 1.2;
                                const eased = cubicEaseInOut(ratio);
                                handX = 259 + (outlineX - 259) * eased;
                                handY = 1204 + (handEndY - 1204) * eased;
                                handEmoji = "👆";
                                alpha = 1;
                            } else if (handTimer <= 3.4) {
                                // Stage 4: Fade out and release
                                const ratio = (handTimer - 2.8) / 0.6;
                                handX = outlineX;
                                handY = handEndY;
                                handEmoji = "🖐️";
                                alpha = Math.max(0, 1 - ratio);
                            } else {
                                // Stage 5: Rest
                                alpha = 0;
                            }

                            // Reduced bounce scale during initial appear
                            let handScale = 1.0;
                            if (handTimer < 0.3) {
                                const t = handTimer / 0.3;
                                handScale = 1.0 - 0.7 * Math.exp(-t * 5) * Math.cos(t * Math.PI * 2);
                            }

                            if (alpha > 0) {
                                handActive = true;
                                tutorialHand.style.display = 'block';
                                tutorialHand.style.left = `${handX}px`;
                                tutorialHand.style.top = `${handY}px`;
                                tutorialHand.style.opacity = alpha;
                                tutorialHand.style.transform = `scale(${handScale})`;
                                if (tutorialHand.textContent !== handEmoji) {
                                    tutorialHand.textContent = handEmoji;
                                }
                            }
                        }
                    }

                    if (!handActive) {
                        tutorialHand.style.display = 'none';
                    }

                    // Draw shape bodies
                    for (let i = 0; i < shapeBodies.length; i++) {
                        drawBody(shapeBodies[i]);
                    }

                    // Draw info callout if active
                    if (infoCallout && infoCallout.active) {
                        if (!shapeBodies.includes(infoCallout.body)) {
                            infoCallout.active = false;
                        } else {
                            infoCallout.timer += dt;
                            if (infoCallout.timer >= 5.5) {
                                infoCallout.active = false;
                            } else {
                                let opacity = 1.0;
                                if (infoCallout.timer > 5.0) {
                                    opacity = 1.0 - (infoCallout.timer - 5.0) / 0.5;
                                }

                                const body = infoCallout.body;
                                const cx = body.position.x;
                                const cy = body.position.y;

                                // Determine shape width for pointer offset
                                let shapeWidth = 100;
                                if (body.circleRadius) {
                                    shapeWidth = body.circleRadius * 2;
                                } else if (body.shapeDef && body.shapeDef.width) {
                                    shapeWidth = body.shapeDef.width;
                                }

                                const halfW = shapeWidth / 2;

                                // Point to the right edge of the shape
                                const targetX = cx + halfW + 6 - 100;
                                const targetY = cy;

                                // Start of the pointing line
                                const startX = Math.min(610, Math.max(cx + halfW + 40, cx + halfW + 120)) - 100;
                                const startY = cy - 25;

                                ctx.save();
                                ctx.globalAlpha = opacity;

                                // Draw the thin dark dotted line pointing to the shape
                                ctx.strokeStyle = '#1E293B';
                                ctx.lineWidth = 2.5;
                                ctx.lineCap = 'round';
                                ctx.setLineDash([5, 5]);
                                ctx.beginPath();
                                ctx.moveTo(startX, startY);
                                ctx.lineTo(targetX, targetY);
                                ctx.stroke();
                                ctx.setLineDash([]);

                                // Draw a tiny dot at the right end of the line
                                ctx.fillStyle = '#1E293B';
                                ctx.beginPath();
                                ctx.arc(startX, startY, 4, 0, Math.PI * 2);
                                ctx.fill();

                                // Draw text above the right part of the line
                                ctx.font = '700 28px Fredoka';
                                ctx.textAlign = 'center';
                                ctx.lineJoin = 'round';
                                ctx.miterLimit = 2;
                                ctx.strokeStyle = '#ffffff';
                                ctx.lineWidth = 6;

                                const lines = infoCallout.text.split('\n');
                                lines.forEach((line, idx) => {
                                    const yPos = startY - 14 - (lines.length - 1 - idx) * 32;
                                    ctx.strokeText(line, startX, yPos);
                                    ctx.fillStyle = '#1E293B';
                                    ctx.fillText(line, startX, yPos);
                                });

                                ctx.restore();
                            }
                        }
                    }


                    // Draw target line (fully bright on top of dimming layer and blocks)
                    drawTargetLine(level);
                    drawHeightMeter(level);
                    drawTargetLineParticles();


                    // Draw drag indicator: a marker on the grabbed point and a thin
                    // line stretching to the pointer to convey the pull/drag force.
                    if (dragState) {
                        const gp = dragState.grabWorld;
                        const tp = dragState.target;
                        const stretch = Math.hypot(tp.x - gp.x, tp.y - gp.y);
                        // More stretch -> warmer, more opaque line to read as more force.
                        const tension = Math.min(1, stretch / 160);

                        ctx.save();
                        // Force line from grab point to the pointer.
                        ctx.lineCap = 'round';
                        ctx.strokeStyle = `rgba(59, 130, 246, ${0.35 + tension * 0.45})`;
                        ctx.lineWidth = 5 + tension * 3;
                        ctx.beginPath();
                        ctx.moveTo(gp.x, gp.y);
                        ctx.lineTo(tp.x, tp.y);
                        ctx.stroke();

                        // Small pointer end-cap.
                        ctx.fillStyle = 'rgba(59, 130, 246, 0.5)';
                        ctx.beginPath();
                        ctx.arc(tp.x, tp.y, 5, 0, Math.PI * 2);
                        ctx.fill();

                        // Grab-point indicator (white core + black ring).
                        ctx.beginPath();
                        ctx.arc(gp.x, gp.y, 10, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                        ctx.fill();
                        ctx.lineWidth = 6;
                        ctx.strokeStyle = 'rgba(0, 0, 0, 0.8)';
                        ctx.stroke();
                        ctx.restore();
                    }

                    // Draw recycle pulses
                    if (recyclePulses.length > 0) {
                        ctx.save();
                        for (const p of recyclePulses) {
                            const t = Math.min(1, p.age / p.duration);
                            const alpha = 1 - t;
                            const scale = cubicEaseOut(t);

                            ctx.globalAlpha = alpha;

                            // Standard circular pulse for world recycling
                            const radius = 20 + 120 * scale;
                            ctx.strokeStyle = '#ffffff';
                            ctx.lineWidth = 8 * (1 - t);
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                            ctx.stroke();

                            // Faint inner secondary ring for a more professional feel
                            ctx.lineWidth = 3 * (1 - t);
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, radius * 0.75, 0, Math.PI * 2);
                            ctx.stroke();
                        }
                        ctx.restore();
                    }

                    drawParticles();

                    if (levelWon) {
                        ctx.save();
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                        ctx.fillRect(0, 0, 720, 1280);
                        ctx.restore();
                    }

                    drawConfetti();

                    ctx.restore();

                    safeRequestAnimationFrame(gameLoop);
                }
                gameLoop(lastTime);
            }

            // Set up cleanup handler for host re-run or switching modes
            window.gameCleanup = () => {
                if (activeAnimationFrameId) {
                    cancelAnimationFrame(activeAnimationFrameId);
                }
                if (loadingAnimId) {
                    cancelAnimationFrame(loadingAnimId);
                }
                // Cancel momentum scrolling
                if (window.stopMomentumScrollGlobal) {
                    window.stopMomentumScrollGlobal();
                }
                activeEventListeners.forEach(({ target, type, listener, options }) => {
                    target.removeEventListener(type, listener, options);
                });
                recyclePulses = [];
                if (musicSource) {
                    try { musicSource.stop(); } catch (e) { }
                }
            };

            // Responsive scaling
            function resizeGame() {
                const world = document.getElementById('game-world');
                const sx = window.innerWidth / 720;
                const sy = window.innerHeight / 1280;
                const s = Math.min(sx, sy);
                world.style.transform = `scale(${s})`;
            }
            window.addEventListener('resize', resizeGame);
            resizeGame();

            // Screen Wake Lock + Orientation Lock
            async function requestWakeLock() {
                try {
                    wakeLockObj = await navigator.wakeLock.request('screen');
                } catch (e) { /* not supported */ }
            }
            requestWakeLock();
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('portrait').catch(() => {});
            }

            // Initialize
            if (mode === 'edit') {
                setupEditMode();
            } else {
                setupPlayMode();
            }
        }
    </script>
</body>
